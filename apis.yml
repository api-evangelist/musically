description: 'musical.ly was a short-form lip-sync and music video social app, popular 2014-2018, that
  was acquired by ByteDance and merged into TikTok on 2 August 2018. The service and brand are defunct.
  It never published an official first-party public API, developer portal, SDKs, or OpenAPI; the only
  known interfaces are unauthorized community reverse-engineering projects. It was surfaced as a Greylock
  portfolio company and added to the API Evangelist network as a stub. An enrichment pass on 2026-07-20
  found no first-party API surface to profile.'
